[project]
name = "learn-ai-advanced"
version = "0.1.0"
description = "RAG, evals, observability, and guardrails -- the AI-app skills MCP/LangGraph lessons don't cover"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "openai>=1.40",
    "azure-identity>=1.17",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
